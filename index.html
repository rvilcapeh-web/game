<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Carros</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #555;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #fff;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui">Puntos: <span id="score">0</span></div>
    <div id="game-over">
        <h1>¡Juego Terminado!</h1>
        <p>Puntuación final: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Jugar de nuevo</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const finalScoreElement = document.getElementById("final-score");
    const gameOverScreen = document.getElementById("game-over");

    // Configuración del jugador (auto)
    const car = {
        x: 180,
        y: 500,
        width: 40,
        height: 70,
        speed: 5,
        color: "#e74c3c"
    };

    // Controles
    const keys = {
        ArrowLeft: false,
        ArrowRight: false
    };

    // Variables del juego
    let obstacles = [];
    let score = 0;
    let obstacleTimer = 0;
    let obstacleSpeed = 4;
    let isGameOver = false;
    let roadOffsetY = 0;

    // Escuchar teclas
    window.addEventListener("keydown", (e) => {
        if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
        if (e.key in keys) keys[e.key] = false;
    });

    function spawnObstacle() {
        const width = 40;
        const height = 70;
        // Posición aleatoria dentro de los límites de la carretera
        const x = Math.random() * (canvas.width - width - 40) + 20;
        obstacles.push({ x, y: -height, width, height, color: "#3498db" });
    }

    function update() {
        if (isGameOver) return;

        // Movimiento del jugador
        if (keys.ArrowLeft && car.x > 20) {
            car.x -= car.speed;
        }
        if (keys.ArrowRight && car.x < canvas.width - car.width - 20) {
            car.x += car.speed;
        }

        // Movimiento del fondo (línea central)
        roadOffsetY = (roadOffsetY + obstacleSpeed) % 40;

        // Generar obstáculos
        obstacleTimer++;
        if (obstacleTimer > 60) {
            spawnObstacle();
            obstacleTimer = 0;
        }

        // Mover obstáculos y detectar colisiones
        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.y += obstacleSpeed;

            // Detección de colisión (AABB)
            if (
                car.x < obs.x + obs.width &&
                car.x + car.width > obs.x &&
                car.y < obs.y + obs.height &&
                car.y + car.height > obs.y
            ) {
                endGame();
            }

            // Eliminar obstáculos fuera de pantalla y aumentar puntos
            if (obs.y > canvas.height) {
                obstacles.splice(i, 1);
                i--;
                score += 10;
                scoreElement.innerText = score;

                // Aumentar la dificultad gradualmente
                if (score % 50 === 0) {
                    obstacleSpeed += 0.5;
                }
            }
        }
    }

    function draw() {
        // Limpiar canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar bordes de la carretera
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(0, 0, 20, canvas.height);
        ctx.fillRect(canvas.width - 20, 0, 20, canvas.height);

        // Dibujar líneas discontinuas del centro
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 6;
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -roadOffsetY;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();

        // Dibujar auto del jugador
        ctx.fillStyle = car.color;
        ctx.fillRect(car.x, car.y, car.width, car.height);

        // Dibujar obstáculos
        for (let obs of obstacles) {
            ctx.fillStyle = obs.color;
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        }
    }

    function gameLoop() {
        update();
        draw();
        if (!isGameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    function endGame() {
        isGameOver = true;
        finalScoreElement.innerText = score;
        gameOverScreen.style.display = "block";
    }

    function resetGame() {
        car.x = 180;
        obstacles = [];
        score = 0;
        obstacleSpeed = 4;
        obstacleTimer = 0;
        isGameOver = false;
        scoreElement.innerText = score;
        gameOverScreen.style.display = "none";
        gameLoop();
    }

    // Iniciar juego
    gameLoop();
</script>

</body>
</html>
